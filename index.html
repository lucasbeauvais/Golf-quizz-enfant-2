<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Golf Academy - L'aventure des Drapeaux avec Coach Tiger</title>
<meta name="description" content="Un jeu pour s'entrainer aux regles et a l'etiquette du golf, avec Coach Tiger le tigre.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%237fd1a3'/%3E%3Ccircle cx='19' cy='16' r='9' fill='%23f0862e'/%3E%3Ccircle cx='45' cy='16' r='9' fill='%23f0862e'/%3E%3Ccircle cx='32' cy='34' r='22' fill='%23f0862e'/%3E%3Cpath d='M26 14 q3 8 0 14' stroke='%2320232a' stroke-width='3' fill='none'/%3E%3Cpath d='M38 14 q-3 8 0 14' stroke='%2320232a' stroke-width='3' fill='none'/%3E%3Ccircle cx='23' cy='31' r='4' fill='%23fff'/%3E%3Ccircle cx='41' cy='31' r='4' fill='%23fff'/%3E%3Ccircle cx='23' cy='32' r='2' fill='%2320232a'/%3E%3Ccircle cx='41' cy='32' r='2' fill='%2320232a'/%3E%3Cellipse cx='32' cy='40' rx='3' ry='2' fill='%2320232a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --panel:#1c1d1f; --panel2:#27282a; --panel3:#141415;
    --ink:#efefec; --inkSoft:#a9aaa8;
    --pink:#c2436e; --purple:#8a63c9; --orange:#d97a2e; --yellow:#d9c34a; --cyan:#4a9aa8;
    --green:#5fd66a; --green-dk:#1f7a3c; --green-lt:#9fe8a4;
    --red:#e0435f; --red-dk:#8a1830;
    --blue:#4a86e0; --blue-dk:#123f9c;
    --line:#38393a;
    --ok:#5fd66a; --ko:#e0435f;
    --shadow:0 20px 55px rgba(0,0,0,.6);
    --outline:#0a0a0a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:'Rubik',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--ink); min-height:100vh; display:flex; justify-content:center;
    padding:16px 12px 44px; position:relative; overflow-x:hidden;
    background:linear-gradient(180deg,#3a3b3c 0%, #232324 45%, #131313 100%);
  }
  h1,h2,.brand,.scorebig{font-family:'Rubik',sans-serif;font-weight:800}

  /* ===================== ANIMATED BACKGROUND (spray + skyline) ===================== */
  .bgfx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .spray{position:absolute;border-radius:50%;filter:blur(26px);opacity:.16;animation:drift linear infinite}
  .spray.s1{top:8%;left:-220px;width:220px;height:220px;background:#5a5b5d;animation-duration:50s}
  .spray.s2{top:52%;left:-260px;width:260px;height:260px;background:var(--cyan);animation-duration:64s;animation-delay:-18s}
  .spray.s3{top:28%;left:-200px;width:190px;height:190px;background:#4a4a3a;animation-duration:74s;animation-delay:-40s}
  @keyframes drift{from{transform:translateX(0)}to{transform:translateX(130vw)}}
  .skyline{position:absolute;left:0;right:0;bottom:0;height:20vh;min-height:110px}
  .skyline svg{width:100%;height:100%;display:block}
  @media (prefers-reduced-motion: reduce){.spray{animation:none}}

  /* ===================== SHELL ===================== */
  .wrap{width:100%;max-width:560px;position:relative;z-index:1}
  .card{background:var(--panel);border-radius:20px;box-shadow:0 4px 0 var(--outline),var(--shadow);overflow:hidden;border:3px solid var(--outline);
    animation:cardIn .45s cubic-bezier(.2,.9,.25,1.2)}
  @keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
  .topbar{background:linear-gradient(120deg,#000 0%,#1c1d1f 55%,#000 100%);color:var(--ink);padding:13px 14px;display:flex;align-items:center;gap:7px;
    position:relative;transition:background .5s ease;box-shadow:0 3px 0 #000,0 4px 12px rgba(0,0,0,.5)}
  .topbar svg.flagicon{flex:0 0 auto;filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
  .topbar.topbar-light{color:#1a1a1f;box-shadow:0 3px 0 var(--outline)}
  .topbar.topbar-light .brand{color:#1a1a1f}
  .topbar.topbar-light .brand small{color:#1a1a1f;opacity:.75}
  .topbar.topbar-light .track{background:rgba(0,0,0,.2)}
  .topbar.topbar-light .mutebtn{color:#1a1a1f;background:rgba(0,0,0,.12);border-color:rgba(0,0,0,.3)}
  .topbar.topbar-light svg.flagicon line{stroke:#1a1a1f}
  .brand{font-size:19px;letter-spacing:.2px;line-height:1.15;color:#fff;flex:1 1 auto;min-width:0}
  .brand .brandtitle{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand small{display:block;font-family:'Rubik',sans-serif;font-size:10px;font-weight:700;opacity:.8;letter-spacing:1.2px;text-transform:uppercase;margin-top:4px;color:var(--inkSoft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .progress{margin-left:auto;font-size:12px;text-align:right;font-weight:700;flex:0 0 auto}
  .track{height:7px;background:rgba(255,255,255,.15);border-radius:99px;margin-top:6px;width:66px;overflow:hidden;border:1px solid rgba(255,255,255,.15)}
  .track > i{display:block;height:100%;background:linear-gradient(90deg,var(--yellow),var(--pink));width:0;transition:width .4s cubic-bezier(.3,.9,.3,1);border-radius:99px}
  .mutebtn{flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.35);
    color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .mutebtn:active{transform:scale(.92)}
  .body{padding:0}
  .pad{padding:20px 18px 24px}

  .decor{width:100%;height:112px;overflow:hidden;line-height:0;position:relative}
  .decor svg{display:block}
  .decor .flagwig{transform-origin:8px 100%;animation:wig 2.6s ease-in-out infinite}
  @keyframes wig{0%,100%{transform:rotate(0deg)}50%{transform:rotate(4deg)}}

  /* ===================== BUTTONS ===================== */
  .btn{appearance:none;border:3px solid var(--outline);cursor:pointer;font:inherit;font-family:'Rubik',sans-serif;background:var(--green);color:#04140a;
    padding:15px 22px;border-radius:14px;font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;
    box-shadow:0 6px 0 var(--outline);
    transition:transform .08s ease, box-shadow .08s ease;position:relative;overflow:hidden}
  .btn:before{content:'';position:absolute;left:0;right:0;top:0;height:48%;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0));pointer-events:none}
  .btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--outline)}
  .btn.big{width:100%;margin-top:8px}
  .btn.orange{background:var(--orange);color:#1a0a00}
  .btn.pink{background:var(--pink);color:#fff}
  .btn.ghost{background:var(--panel2);color:var(--ink);box-shadow:0 5px 0 var(--outline)}
  .btn[disabled]{opacity:.45;cursor:default}
  .mixcard{margin-top:18px;width:100%;appearance:none;border:3px solid var(--purple);background:var(--panel2);color:#c9b8e8;
    font:inherit;font-family:'Rubik',sans-serif;font-weight:800;font-size:15px;padding:14px;border-radius:16px;cursor:pointer;display:flex;align-items:center;gap:10px;text-align:left;
    box-shadow:0 5px 0 var(--outline);transition:transform .08s ease, box-shadow .08s ease}
  .mixcard:active{transform:translateY(4px);box-shadow:0 1px 0 var(--outline)}
  .mixcard[disabled]{opacity:.5;cursor:default}
  .mixcard[disabled]:active{transform:none}
  .mixcard .mixtxt span{display:block;font-family:'Rubik',sans-serif;font-weight:600;font-size:12px;color:var(--inkSoft);margin-top:2px}

  /* ===================== TIGER COACH ===================== */
  .tiger-wrap{display:flex;align-items:flex-end;gap:10px;margin:2px 0 14px}
  .tiger-wrap.center{justify-content:center}
  .tiger{flex:0 0 auto;animation:tigerBob 2.8s ease-in-out infinite}
  .tiger.happy{animation:tigerJump .6s ease}
  .tiger.sad{animation:tigerShake .5s ease}
  @keyframes tigerBob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-6px) rotate(1deg)}}
  @keyframes tigerJump{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-16px) scale(1.05)}55%{transform:translateY(0) scale(.98)}75%{transform:translateY(-6px)}100%{transform:translateY(0)}}
  @keyframes tigerShake{0%,100%{transform:translateX(0) rotate(0)}20%{transform:translateX(-5px) rotate(-4deg)}40%{transform:translateX(5px) rotate(4deg)}60%{transform:translateX(-3px) rotate(-2deg)}80%{transform:translateX(3px) rotate(2deg)}}
  .bubble{position:relative;background:var(--panel2);border:2.5px solid var(--outline);border-radius:16px;padding:10px 13px;font-size:13.5px;line-height:1.4;
    color:var(--ink);font-weight:600;box-shadow:0 3px 0 var(--outline);flex:1;min-width:0}
  .bubble:before{content:'';position:absolute;left:-9px;bottom:14px;width:0;height:0;border:8px solid transparent;border-right-color:var(--panel2)}
  .bubble:after{content:'';position:absolute;left:-12px;bottom:12px;width:0;height:0;border:9px solid transparent;border-right-color:var(--outline);z-index:-1}
  @media (prefers-reduced-motion: reduce){.tiger,.tiger.happy,.tiger.sad{animation:none}}

  /* ===================== PROFILE ===================== */
  .profile h1,.home h1,.collection h1{font-size:22px;margin:6px 0 4px;text-align:center;color:var(--ink);font-weight:800}
  .subhead{text-align:center;font-size:13px;color:var(--inkSoft);font-weight:600;margin:0 0 14px}
  .lbl{display:block;font-size:12px;letter-spacing:.8px;text-transform:uppercase;color:var(--inkSoft);font-weight:800;margin:16px 0 8px}
  .nameinput{width:100%;font:inherit;font-family:'Rubik',sans-serif;font-size:19px;font-weight:700;padding:14px 16px;border-radius:14px;
    border:2.5px solid var(--outline);background:var(--panel2);color:var(--ink);outline:none;text-align:center;box-shadow:0 3px 0 var(--outline)}
  .nameinput::placeholder{color:var(--inkSoft);opacity:.7}
  .nameinput:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(57,255,106,.25),0 3px 0 var(--outline)}
  .avatargrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .avataropt{position:relative;background:var(--panel2);border:2.5px solid var(--outline);border-radius:16px;padding:6px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--outline);transition:border-color .12s ease, transform .08s ease, box-shadow .08s ease}
  .avataropt:active{transform:translateY(3px);box-shadow:0 0 0 var(--outline)}
  .avataropt.sel{border-color:var(--green);box-shadow:0 0 0 3px rgba(57,255,106,.4),0 3px 0 var(--outline);transform:scale(1.03)}
  .avataropt.locked{cursor:default;opacity:.85}
  .avataropt .lock{position:absolute;inset:0;background:rgba(10,10,12,.78);border-radius:13px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;font-size:9.5px;font-weight:800;color:var(--yellow)}

  /* ===================== HOME / MAP ===================== */
  .playercard{display:flex;align-items:center;gap:12px;background:var(--panel2);border:3px solid var(--outline);border-radius:18px;padding:12px 14px;
    margin-top:-34px;position:relative;box-shadow:0 5px 0 var(--outline)}
  .pc-av-wrap{position:relative;flex:0 0 auto}
  .playercard .pc-av{background:var(--panel3);border-radius:14px;padding:3px;line-height:0;border:2.5px solid var(--outline)}
  .pc-lvl{position:absolute;right:-10px;bottom:-10px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.4))}
  .pc-txt{flex:1;min-width:0}
  .pc-txt b{display:block;font-size:18px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Rubik',sans-serif}
  .pc-txt span{font-size:12px;color:var(--inkSoft);font-weight:600}
  .pc-stars{flex:0 0 auto;display:flex;align-items:center;gap:5px;font-weight:800;color:var(--yellow);font-size:15px;font-family:'Rubik',sans-serif}
  .sectitle{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--inkSoft);font-weight:800;margin:20px 0 2px;text-align:center}

  .roadmap{position:relative;margin:14px 0 4px;padding-left:2px}
  .roadmap:before{content:'';position:absolute;left:34px;top:10px;bottom:10px;width:4px;border-radius:99px;
    background:repeating-linear-gradient(180deg,#4a4b54 0 10px, transparent 10px 18px)}
  .stage{position:relative;display:flex;align-items:center;gap:14px;padding:10px 4px;margin-bottom:2px}
  .stage .node{flex:0 0 auto;width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    position:relative;z-index:1;border:4px solid var(--panel);box-shadow:0 0 0 3px var(--outline),0 6px 0 var(--outline);cursor:pointer;transition:transform .1s ease,box-shadow .1s ease}
  .stage .node:active{transform:translateY(4px);box-shadow:0 0 0 3px var(--outline),0 2px 0 var(--outline)}
  .stage.locked .node{cursor:default;filter:grayscale(.6);opacity:.65}
  .stage.next .node{animation:nodePulse 1.8s ease-in-out infinite}
  @keyframes nodePulse{0%,100%{box-shadow:0 0 0 3px var(--outline),0 6px 0 var(--outline),0 0 0 0 rgba(217,195,74,.55)}50%{box-shadow:0 0 0 3px var(--outline),0 6px 0 var(--outline),0 0 0 10px rgba(217,195,74,0)}}
  .stage .sinfo{flex:1;min-width:0;background:var(--panel2);border:2.5px solid var(--outline);border-radius:14px;padding:9px 12px;cursor:pointer;box-shadow:0 3px 0 var(--outline)}
  .stage.locked .sinfo{cursor:default;opacity:.6}
  .stage .sinfo b{display:block;font-size:14.5px;color:var(--ink);font-family:'Rubik',sans-serif}
  .stage .sinfo span{font-size:11.5px;color:var(--inkSoft);font-weight:600}
  .stage .sstars{display:flex;gap:1px;margin-top:3px}
  .stage .lockbadge{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(0,0,0,.35)}
  .homebtns{margin-top:18px;display:flex;flex-direction:column;gap:10px}

  /* ===================== COLLECTION ===================== */
  .mascotgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
  .mascot{position:relative;display:flex;align-items:center;gap:10px;background:var(--panel2);border:2.5px solid var(--outline);border-radius:16px;
    padding:9px 11px;cursor:pointer;box-shadow:0 3px 0 var(--outline);transition:border-color .12s ease,transform .08s ease,box-shadow .08s ease}
  .mascot:active{transform:translateY(3px);box-shadow:0 0 0 var(--outline)}
  .mascot.sel{border-color:var(--green);box-shadow:0 0 0 3px rgba(57,255,106,.35),0 3px 0 var(--outline)}
  .mascot.locked{cursor:default}
  .mascot .mtx{min-width:0}
  .mascot .mtx b{display:block;font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Rubik',sans-serif}
  .mascot .mtx span{font-size:11px;color:var(--inkSoft);font-weight:600}
  .mascot .mlock{position:absolute;inset:0;background:rgba(10,10,12,.82);border-radius:14px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:11.5px;font-weight:800;color:var(--yellow)}

  /* ===================== PLAY ===================== */
  .playbar{display:flex;align-items:center;gap:9px;background:var(--panel2);border:2.5px solid var(--outline);border-radius:14px;padding:7px 10px;margin-bottom:14px;box-shadow:0 3px 0 var(--outline)}
  .playbar .pb-av{line-height:0;flex:0 0 auto;border-radius:50%;border:2px solid var(--outline)}
  .pb-name{font-weight:800;font-size:13.5px;color:var(--green);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:'Rubik',sans-serif}
  .pb-score{font-size:12.5px;font-weight:800;color:var(--inkSoft);flex:0 0 auto}
  .pb-streak{flex:0 0 auto;background:linear-gradient(120deg,var(--yellow),var(--orange));color:#2a1a00;font-size:11px;font-weight:800;padding:4px 9px;border-radius:99px;border:2px solid var(--outline);animation:flamePulse 1s ease-in-out infinite}
  @keyframes flamePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  .meta{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .badge{font-size:11px;letter-spacing:.3px;text-transform:uppercase;padding:5px 10px;border-radius:8px;font-weight:800;border:2px solid var(--outline);box-shadow:0 2px 0 var(--outline)}
  .badge.theme{background:var(--green);color:#04140a}
  .badge.ref{background:var(--panel2);color:var(--inkSoft)}
  .leveldot{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--inkSoft);font-weight:800}
  .leveldot i{width:11px;height:11px;border-radius:50%;display:inline-block;border:1.5px solid var(--outline)}
  .scene{width:100%;height:auto;display:block;border-radius:14px;border:2.5px solid var(--outline);background:#8bc34a;margin-bottom:14px;
    box-shadow:0 3px 0 var(--outline);animation:sceneIn .35s ease}
  @keyframes sceneIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
  .qtext{font-size:18px;line-height:1.42;font-weight:700;color:var(--ink);margin:2px 0 14px;font-family:'Rubik',sans-serif}
  .choices{display:flex;flex-direction:column;gap:10px}
  .tapzone{position:relative;margin-bottom:6px;cursor:crosshair}
  .tapzone .scene{margin-bottom:0}
  .tapzone.answered{pointer-events:none}
  .tapinstruct{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--inkSoft);margin:10px 0 4px}
  .tapmark{position:absolute;width:32px;height:32px;margin-left:-16px;margin-top:-16px;border-radius:50%;pointer-events:none;animation:tapPing .45s ease}
  .tapmark.good{border:4px solid var(--ok);box-shadow:0 0 0 4px rgba(95,214,106,.25)}
  .tapmark.bad{border:4px solid var(--ko);box-shadow:0 0 0 4px rgba(224,67,95,.25)}
  .taptarget{position:absolute;margin-left:0;margin-top:0;border-radius:50%;border:3px dashed var(--ok);pointer-events:none;animation:targetPulse 1.2s ease-in-out infinite}
  @keyframes tapPing{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
  @keyframes targetPulse{0%,100%{opacity:.45}50%{opacity:1}}
  .choice{text-align:left;background:var(--panel2);border:2.5px solid var(--outline);color:var(--ink);padding:13px 14px;border-radius:14px;font-size:15px;
    font-weight:600;cursor:pointer;font:inherit;font-family:'Rubik',sans-serif;display:flex;gap:11px;align-items:flex-start;box-shadow:0 3px 0 var(--outline);
    transition:background .12s ease, transform .08s ease, box-shadow .08s ease}
  .choice:active{transform:translateY(3px);box-shadow:0 0 0 var(--outline)}
  .choice .letter{flex:0 0 auto;width:26px;height:26px;border-radius:8px;background:var(--panel3);border:1.5px solid var(--outline);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--yellow);font-family:'Rubik',sans-serif}
  .choice.correct{border-color:var(--ok);background:#0f3a1f;box-shadow:0 3px 0 var(--ok);animation:popGood .35s ease}
  .choice.correct .letter{background:var(--ok);color:#04140a;border-color:var(--outline)}
  .choice.wrong{border-color:var(--ko);background:#3a0f18;box-shadow:0 3px 0 var(--ko);animation:shakeX .4s ease}
  .choice.wrong .letter{background:var(--ko);color:#2a0006;border-color:var(--outline)}
  .choice[disabled]{cursor:default}
  @keyframes popGood{0%{transform:scale(1)}40%{transform:scale(1.035)}100%{transform:scale(1)}}
  .tools{display:flex;gap:10px;margin-top:14px;align-items:center}
  .hintbtn{background:var(--panel2);border:2.5px dashed var(--purple);color:#d9b8ff;padding:10px 14px;border-radius:12px;font:inherit;
    font-family:'Rubik',sans-serif;font-weight:800;font-size:13.5px;cursor:pointer;display:flex;gap:7px;align-items:center;box-shadow:0 3px 0 rgba(138,99,201,.35)}
  .hintbtn:active{transform:translateY(3px);box-shadow:0 0 0 rgba(138,99,201,.35)}
  .hintzone{margin-top:12px;display:none}
  .hintzone.show{display:flex}
  .explain{margin-top:14px;padding:0;border-radius:14px;font-size:14.5px;line-height:1.55;display:none}
  .explain.show{display:flex;gap:10px;align-items:flex-start;animation:slideUp .3s ease}
  @keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .explain .ebubble{flex:1;min-width:0;padding:12px 14px;border-radius:14px;border:2.5px solid var(--outline);box-shadow:0 3px 0 var(--outline);font-family:'Rubik',sans-serif}
  .explain.good .ebubble{background:#0f3a1f;border-color:var(--ok);color:var(--ink)}
  .explain.bad .ebubble{background:#3a0f18;border-color:var(--ko);color:var(--ink)}
  .explain b{display:block;margin-bottom:4px;font-size:15px;font-family:'Rubik',sans-serif}
  .nextrow{margin-top:16px;display:none}
  .nextrow.show{display:flex}
  .nextrow .btn{width:100%}

  /* ===================== RESULT ===================== */
  .result{text-align:center;padding:4px 2px}
  .result h2{font-size:22px;margin:10px 0 4px;color:var(--ink);font-weight:800}
  .starsbig{display:flex;justify-content:center;gap:8px;margin:12px 0 4px}
  .scorebig{font-weight:800;font-size:46px;color:var(--green);line-height:1;margin:6px 0}
  .scorebig small{font-size:20px;color:var(--inkSoft);font-weight:700;-webkit-text-stroke:0;text-shadow:none}
  .verdict{font-size:14.5px;color:var(--inkSoft);max-width:430px;margin:8px auto 4px;line-height:1.55;font-weight:600}
  .unlock{margin:12px auto 2px;background:linear-gradient(120deg,#3a2f0a,#4a3c0c);border:2.5px solid var(--outline);color:var(--yellow);font-weight:800;
    font-size:13.5px;padding:11px 15px;border-radius:14px;display:inline-flex;align-items:center;gap:9px;box-shadow:0 3px 0 var(--outline);animation:unlockPop .5s ease}
  @keyframes unlockPop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
  .evorow{margin:14px auto 2px;background:linear-gradient(120deg,#3a2f0a,#4a3c0c);border:2.5px solid var(--outline);border-radius:16px;
    padding:14px 15px;box-shadow:0 3px 0 var(--outline);animation:unlockPop .5s ease;max-width:320px}
  .evolabel{color:var(--yellow);font-weight:800;font-size:14px;margin-bottom:8px}
  .evorow-imgs{display:flex;align-items:center;justify-content:center;gap:12px}
  .scorecard{margin:16px 0 6px;border:2.5px solid var(--outline);border-radius:14px;overflow:hidden;background:var(--panel2);box-shadow:0 3px 0 var(--outline)}
  .scorecard .row{display:flex;font-size:12.5px;border-bottom:1px solid var(--line)}
  .scorecard .row:last-child{border-bottom:0}
  .scorecard .row > div{padding:8px 10px}
  .scorecard .row .n{width:34px;color:var(--yellow);font-weight:800;flex:0 0 auto;text-align:center;background:var(--panel3)}
  .scorecard .row .t{flex:1;text-align:left;color:var(--ink);font-weight:600}
  .scorecard .row .m{flex:0 0 auto;width:34px;text-align:center;font-weight:800}
  .scorecard .row .m.y{color:var(--ok)}
  .scorecard .row .m.x{color:var(--ko)}
  .bestrow{display:inline-flex;align-items:center;gap:7px;margin:2px auto 0;background:#3a2f0a;border:2.5px solid var(--outline);color:var(--yellow);font-size:12.5px;font-weight:800;padding:6px 13px;border-radius:99px;box-shadow:0 3px 0 var(--outline)}
  .footer{margin-top:16px;font-size:11px;color:var(--inkSoft);text-align:center;line-height:1.5;opacity:.7}

  /* ===================== FX ===================== */
  .confetti{position:fixed;pointer-events:none;z-index:60;will-change:transform,opacity;animation:confettiPop 1s ease-out forwards}
  @keyframes confettiPop{0%{opacity:1;transform:translate(0,0) rotate(0deg) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.4)}}
  @keyframes shakeX{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
  .shake{animation:shakeX .4s ease}
  @keyframes pop{0%{transform:scale(.3) rotate(-15deg);opacity:0}70%{transform:scale(1.15) rotate(5deg)}100%{transform:scale(1) rotate(0);opacity:1}}
  .starpop{animation:pop .5s cubic-bezier(.3,1.5,.5,1) both}
  .fadein{animation:fadeInUp .35s ease both}
  @keyframes fadeInUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .pluspop{position:fixed;z-index:61;font-family:'Rubik',sans-serif;font-weight:800;font-size:22px;color:var(--green);
    text-shadow:0 2px 0 var(--outline);pointer-events:none;animation:plusFloat .9s ease-out forwards}
  @keyframes plusFloat{0%{opacity:0;transform:translateY(0) scale(.5) rotate(-6deg)}18%{opacity:1;transform:translateY(-8px) scale(1.2) rotate(4deg)}100%{opacity:0;transform:translateY(-52px) scale(1) rotate(0)}}
  @media (prefers-reduced-motion: reduce){.shake{animation:none}.confetti{display:none}.starpop{animation:none}.fadein{animation:none}.card{animation:none}.pluspop{display:none}}

</style>
</head>
<body>

<script>
/* ============================================================
   BRIQUES SVG (scenes de jeu)
   ============================================================ */
var VB='0 0 400 230';
var SCENE_DEFS='<defs>'+
  '<pattern id="mow" width="34" height="230" patternUnits="userSpaceOnUse"><rect width="34" height="230" fill="#6fa83a"/><rect width="17" height="230" fill="#7cb943"/></pattern>'+
  '<pattern id="mowGreen" width="22" height="230" patternUnits="userSpaceOnUse"><rect width="22" height="230" fill="#9ad35f"/><rect width="11" height="230" fill="#a6dd6c"/></pattern>'+
  '<linearGradient id="waterG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a6fa8"/><stop offset=".55" stop-color="#3a95c9"/><stop offset="1" stop-color="#1a5a85"/></linearGradient>'+
  '<linearGradient id="poleG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f4f4f2"/><stop offset=".5" stop-color="#c7c8ce"/><stop offset="1" stop-color="#8a8b8e"/></linearGradient>'+
  '<linearGradient id="flagG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff5c78"/><stop offset="1" stop-color="#c21138"/></linearGradient>'+
  '<radialGradient id="sandG" cx="45%" cy="35%" r="70%"><stop offset="0" stop-color="#f0e2b8"/><stop offset="1" stop-color="#d9c48f"/></radialGradient>'+
  '<filter id="softSh" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.2"/></filter>'+
  '</defs>';
function svg(i){return '<svg class="scene" viewBox="'+VB+'" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">'+SCENE_DEFS+i+'</svg>';}
function grass(){return '<rect x="0" y="0" width="400" height="230" fill="url(#mow)"/><rect x="0" y="0" width="400" height="230" fill="#000" opacity="0.05"/>';}
function fairway(){return '<path d="M120 230 Q150 120 175 30 L245 30 Q235 130 280 230 Z" fill="url(#mow)"/>';}
function ball(x,y){return '<ellipse cx="'+x+'" cy="'+(y+2)+'" rx="8" ry="3.4" fill="#000" opacity=".3" filter="url(#softSh)"/><circle cx="'+x+'" cy="'+y+'" r="7" fill="#fff" stroke="#b7b7a6"/><circle cx="'+(x-2)+'" cy="'+(y-2)+'" r="1.4" fill="#e6e6da"/>';}
function flag(x,y){return '<ellipse cx="'+x+'" cy="'+(y+2)+'" rx="8" ry="3.2" fill="#000" opacity=".28" filter="url(#softSh)"/><line x1="'+x+'" y1="'+y+'" x2="'+x+'" y2="'+(y-38)+'" stroke="url(#poleG)" stroke-width="2.6"/><path d="M'+x+' '+(y-38)+' l 20 6 l -20 6 z" fill="url(#flagG)"/><ellipse cx="'+x+'" cy="'+(y+1)+'" rx="7" ry="3" fill="#12261a"/>';}
function markX(x,y){return '<g stroke="#c81d25" stroke-width="3" stroke-linecap="round"><line x1="'+(x-7)+'" y1="'+(y-7)+'" x2="'+(x+7)+'" y2="'+(y+7)+'"/><line x1="'+(x+7)+'" y1="'+(y-7)+'" x2="'+(x-7)+'" y2="'+(y+7)+'"/></g>';}
function label(x,y,t,f){return '<text x="'+x+'" y="'+y+'" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="'+(f||'#fff')+'" text-anchor="middle">'+t+'</text>';}
function marker(x,y){return '<ellipse cx="'+x+'" cy="'+(y+3)+'" rx="6" ry="2" fill="#000" opacity=".15"/><circle cx="'+x+'" cy="'+y+'" r="5.5" fill="#d33" stroke="#7a1010"/><circle cx="'+x+'" cy="'+y+'" r="2" fill="#fff"/>';}
function bag(x,y,c){c=c||'#2d6a4f';return '<g>'+
  '<ellipse cx="'+x+'" cy="'+(y+24)+'" rx="14" ry="4" fill="#000" opacity=".15"/>'+
  '<line x1="'+(x-4)+'" y1="'+(y-4)+'" x2="'+(x-7)+'" y2="'+(y-22)+'" stroke="#555" stroke-width="2"/>'+
  '<line x1="'+(x+3)+'" y1="'+(y-4)+'" x2="'+(x+6)+'" y2="'+(y-24)+'" stroke="#555" stroke-width="2"/>'+
  '<circle cx="'+(x-7)+'" cy="'+(y-22)+'" r="2.5" fill="#333"/><circle cx="'+(x+6)+'" cy="'+(y-24)+'" r="2.5" fill="#333"/>'+
  '<rect x="'+(x-9)+'" y="'+(y-6)+'" width="18" height="30" rx="8" fill="'+c+'"/>'+
  '<rect x="'+(x-9)+'" y="'+(y+3)+'" width="18" height="6" fill="#fff" opacity=".3"/></g>';}
function person(x,y){return '<g stroke="#20301f" stroke-width="3" stroke-linecap="round" fill="none">'+
  '<circle cx="'+x+'" cy="'+(y-16)+'" r="5" fill="#20301f" stroke="none"/>'+
  '<line x1="'+x+'" y1="'+(y-11)+'" x2="'+x+'" y2="'+(y+2)+'"/>'+
  '<line x1="'+x+'" y1="'+(y-6)+'" x2="'+(x-7)+'" y2="'+(y-1)+'"/><line x1="'+x+'" y1="'+(y-6)+'" x2="'+(x+7)+'" y2="'+(y-1)+'"/>'+
  '<line x1="'+x+'" y1="'+(y+2)+'" x2="'+(x-6)+'" y2="'+(y+14)+'"/><line x1="'+x+'" y1="'+(y+2)+'" x2="'+(x+6)+'" y2="'+(y+14)+'"/></g>';}

function sceneGreen(bx,by,extra){return svg(grass()+
  '<ellipse cx="200" cy="120" rx="150" ry="95" fill="url(#mowGreen)"/>'+
  '<ellipse cx="200" cy="120" rx="150" ry="95" fill="none" stroke="#7cb342" stroke-width="3"/>'+
  flag(250,96)+'<circle cx="250" cy="96" r="6" fill="#12261a"/>'+(extra||'')+ball(bx,by));}
function sceneWaterRed(bx,by,extra){return svg(grass()+fairway()+
  '<path d="M250 40 Q360 60 355 150 Q350 220 250 215 Q300 130 250 40 Z" fill="url(#waterG)"/>'+
  '<path d="M250 40 Q360 60 355 150 Q350 220 250 215 Q300 130 250 40 Z" fill="none" stroke="#c81d25" stroke-width="3" stroke-dasharray="9 6"/>'+
  '<g stroke="#c81d25" stroke-width="3"><line x1="252" y1="42" x2="252" y2="30"/><line x1="300" y1="118" x2="308" y2="110"/><line x1="252" y1="214" x2="252" y2="226"/></g>'+
  label(300,150,"Zone rouge","#0d3b52")+(extra||'')+(bx!==null?ball(bx,by):''));}
function sceneWaterYellow(bx,by,extra){return svg(grass()+fairway()+
  '<path d="M60 150 Q200 120 340 150 L340 210 Q200 185 60 210 Z" fill="url(#waterG)"/>'+
  '<path d="M60 150 Q200 120 340 150" fill="none" stroke="#f2c400" stroke-width="3" stroke-dasharray="9 6"/>'+
  '<g stroke="#e0b000" stroke-width="3"><line x1="90" y1="150" x2="90" y2="138"/><line x1="200" y1="127" x2="200" y2="115"/><line x1="310" y1="150" x2="310" y2="138"/></g>'+
  label(200,190,"Zone jaune","#5a4a00")+(extra||'')+(bx!==null?ball(bx,by):''));}
function sceneBunker(bx,by,extra){return svg(grass()+
  '<ellipse cx="200" cy="150" rx="150" ry="70" fill="url(#sandG)"/>'+
  '<ellipse cx="200" cy="150" rx="150" ry="70" fill="none" stroke="#cbb877" stroke-width="3"/>'+
  '<ellipse cx="200" cy="60" rx="120" ry="45" fill="url(#mowGreen)"/>'+flag(210,52)+
  label(200,150,"Bunker","#8a6d1f")+(extra||'')+ball(bx,by));}
function sceneTee(bx,by,extra){return svg(grass()+
  '<ellipse cx="200" cy="120" rx="140" ry="80" fill="#8bc34a"/>'+
  '<circle cx="120" cy="105" r="8" fill="#1f6feb"/><circle cx="280" cy="105" r="8" fill="#1f6feb"/>'+
  '<line x1="120" y1="105" x2="280" y2="105" stroke="#fff" stroke-width="2" stroke-dasharray="4 6" opacity=".8"/>'+
  label(200,92,"Depart","#20301f")+(extra||'')+ball(bx,by));}
function sceneOB(bx,by,extra){return svg(grass()+
  '<rect x="300" y="0" width="100" height="230" fill="#6d8b4a"/>'+
  '<line x1="300" y1="0" x2="300" y2="230" stroke="#fff" stroke-width="3"/>'+
  '<g fill="#fff" stroke="#cfcfcf"><rect x="296" y="30" width="8" height="26" rx="2"/><rect x="296" y="110" width="8" height="26" rx="2"/><rect x="296" y="190" width="8" height="26" rx="2"/></g>'+
  (extra||'')+ball(bx,by));}
function sceneTrees(bx,by,extra){function tree(x,y,r){return '<circle cx="'+x+'" cy="'+y+'" r="'+r+'" fill="#3f6b2e"/><circle cx="'+(x-r*0.4)+'" cy="'+(y-r*0.3)+'" r="'+(r*0.6)+'" fill="#4c7f36"/>';}
  return svg(grass()+'<rect x="0" y="0" width="400" height="230" fill="#5a7a3a" opacity=".35"/>'+
  tree(90,70,34)+tree(160,50,30)+tree(250,64,36)+tree(320,80,30)+tree(120,130,26)+(extra||'')+ball(bx,by));}
function sceneCartPath(bx,by,extra){return svg(grass()+fairway()+
  '<path d="M40 0 Q120 100 60 230 L110 230 Q150 110 90 0 Z" fill="#c9c9c2"/>'+
  '<path d="M40 0 Q120 100 60 230" fill="none" stroke="#a7a79e" stroke-width="2"/>'+
  label(75,120,"Chemin","#4a4a45")+(extra||'')+ball(bx,by));}
function sceneGUR(bx,by,mode,extra){var z=(mode==='water')
  ? '<ellipse cx="200" cy="130" rx="80" ry="45" fill="#7fc9e8" opacity=".85"/><ellipse cx="200" cy="130" rx="80" ry="45" fill="none" stroke="#3a8db0" stroke-width="2"/>'+label(200,133,"Flaque","#0d3b52")
  : '<ellipse cx="200" cy="130" rx="80" ry="45" fill="#7cb342"/><ellipse cx="200" cy="130" rx="80" ry="45" fill="none" stroke="#fff" stroke-width="2.5" stroke-dasharray="7 5"/>'+label(200,127,"G.U.R.","#fff")+label(200,142,"terrain en reparation","#20301f");
  return svg(grass()+fairway()+z+(extra||'')+ball(bx,by));}
function sceneEmbedded(bx,by){return svg(grass()+fairway()+
  '<ellipse cx="'+bx+'" cy="'+(by+2)+'" rx="16" ry="9" fill="#5a7a3a"/>'+
  '<ellipse cx="'+bx+'" cy="'+(by+2)+'" rx="16" ry="9" fill="none" stroke="#3f5a26" stroke-width="1.5"/>'+
  '<circle cx="'+bx+'" cy="'+by+'" r="7" fill="#fff" stroke="#b7b7a6"/>'+
  label(bx,by-18,"balle enfoncee","#20301f"));}
function sceneFairway(bx,by,extra){return svg(grass()+fairway()+
  '<ellipse cx="210" cy="45" rx="55" ry="26" fill="url(#mowGreen)"/>'+flag(225,40)+(extra||'')+ball(bx,by));}

/* --- scenes specifiques --- */
function sceneSafety(){return svg(grass()+
  '<ellipse cx="240" cy="90" rx="120" ry="58" fill="url(#mowGreen)"/>'+flag(285,78)+
  person(250,120)+label(250,145,"joueur devant","#20301f")+
  ball(80,180)+label(80,205,"toi","#20301f"));}
function sceneBag(){return svg(grass()+
  '<ellipse cx="190" cy="110" rx="120" ry="66" fill="url(#mowGreen)"/>'+flag(190,90)+'<circle cx="190" cy="90" r="6" fill="#12261a"/>'+
  '<line x1="320" y1="55" x2="366" y2="34" stroke="#20301f" stroke-width="2"/><path d="M366 34 l-9 1 l4 6 z" fill="#20301f"/>'+label(350,24,"trou suivant","#20301f")+
  bag(190,118,'#c81d25')+label(190,150,"A","#20301f")+
  bag(340,120,'#2d6a4f')+label(340,152,"B","#20301f")+
  bag(60,185,'#1f6feb')+label(60,214,"C","#20301f"));}
function sceneOrder(){return svg(grass()+
  '<ellipse cx="200" cy="115" rx="145" ry="82" fill="url(#mowGreen)"/>'+flag(200,95)+'<circle cx="200" cy="95" r="6" fill="#12261a"/>'+
  ball(238,122)+label(238,144,"balle A","#20301f")+
  ball(85,178)+label(85,200,"balle B","#20301f"));}
function scenePitch(bx,by,noLabel){return svg(grass()+
  '<ellipse cx="200" cy="120" rx="150" ry="95" fill="url(#mowGreen)"/>'+flag(255,96)+'<circle cx="255" cy="96" r="6" fill="#12261a"/>'+
  '<ellipse cx="'+(bx-26)+'" cy="'+by+'" rx="11" ry="6" fill="#6f8f4a"/>'+
  '<ellipse cx="'+(bx-26)+'" cy="'+by+'" rx="11" ry="6" fill="none" stroke="#4f6a32" stroke-width="1.5"/>'+
  (noLabel?'':label(bx-26,by-13,"pitch","#20301f"))+ball(bx,by));}
function sceneTool(){var cx=200,cy=62;
  var t='<g stroke="#2b2b2b" stroke-width="7" fill="none" stroke-linecap="round">'+
    '<line x1="'+cx+'" y1="'+(cy+80)+'" x2="'+cx+'" y2="'+(cy+18)+'"/>'+
    '<line x1="'+(cx-22)+'" y1="'+(cy+18)+'" x2="'+(cx-22)+'" y2="'+(cy-38)+'"/>'+
    '<line x1="'+(cx+22)+'" y1="'+(cy+18)+'" x2="'+(cx+22)+'" y2="'+(cy-38)+'"/>'+
    '<path d="M'+(cx-22)+' '+(cy+18)+' Q'+cx+' '+(cy+38)+' '+(cx+22)+' '+(cy+18)+'"/></g>'+
    '<rect x="'+(cx-7)+'" y="'+(cy+82)+'" width="14" height="46" rx="7" fill="#2d6a4f"/>';
  return svg(grass()+'<ellipse cx="200" cy="196" rx="60" ry="12" fill="#000" opacity=".08"/>'+t+label(200,220,"Quel est cet objet ?","#20301f"));}
function sceneDivot(){return svg(grass()+fairway()+
  '<ellipse cx="185" cy="150" rx="22" ry="11" fill="#7a5a34"/>'+
  '<ellipse cx="185" cy="150" rx="22" ry="11" fill="none" stroke="#5a4020" stroke-width="1.5"/>'+
  '<ellipse cx="248" cy="162" rx="17" ry="8" fill="#6b8f3a"/>'+
  '<ellipse cx="248" cy="162" rx="17" ry="8" fill="none" stroke="#4f6a32" stroke-width="1"/>'+
  label(185,135,"trou","#20301f")+label(255,182,"la motte","#20301f"));}
function sceneRake(){return svg(grass()+
  '<ellipse cx="200" cy="150" rx="150" ry="70" fill="url(#sandG)"/>'+
  '<ellipse cx="200" cy="150" rx="150" ry="70" fill="none" stroke="#cbb877" stroke-width="3"/>'+
  '<g stroke="#cbb877" stroke-width="2"><line x1="120" y1="138" x2="175" y2="138"/><line x1="120" y1="150" x2="175" y2="150"/><line x1="120" y1="162" x2="175" y2="162"/></g>'+
  '<line x1="248" y1="105" x2="298" y2="176" stroke="#8a5a2a" stroke-width="4"/>'+
  '<line x1="288" y1="188" x2="316" y2="164" stroke="#8a5a2a" stroke-width="4"/>'+
  '<g stroke="#8a5a2a" stroke-width="2"><line x1="290" y1="184" x2="293" y2="192"/><line x1="297" y1="180" x2="300" y2="188"/><line x1="304" y1="175" x2="307" y2="183"/><line x1="311" y1="170" x2="314" y2="178"/></g>'+

function topbarGradFor(flag){
  if(flag==='all') return 'linear-gradient(120deg,#1f9d55,#c81d25 28%,#1f6feb 52%,#eab308 76%,#c8cdc6)';
  return FLAGS[flag].grad;
}

}

var TARGET=5, ROUND=5, order=[], current=0, score=0, results=[], answered=false, curFlag="vert";
var streak=0, maxStreak=0;

function shuffle(a){var r=a.slice();for(var i=r.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=r[i];r[i]=r[j];r[j]=t;}return r;}
function poolFor(f){if(f==='all')return BANK.slice();var p=[];for(var i=0;i<BANK.length;i++){if(BANK[i].flag===f)p.push(BANK[i]);}return p;}

var ETQ_THEMES={"Etiquette":1,"Comportement":1,"Securite":1,"Rapidite":1};
var recentQs={};
function notIn(list){return function(q){return list.indexOf(q)===-1;};}
function buildRound(flag){
  var pool=poolFor(flag);
  var recent=recentQs[flag]||[];
  var cand=pool.filter(notIn(recent));
  if(cand.length<TARGET){var prev=recent.slice(0,TARGET);cand=pool.filter(notIn(prev));}
  if(cand.length<TARGET)cand=pool.slice();
  var picked=shuffle(cand).slice(0,Math.min(TARGET,cand.length));
  var hasE=false;
  for(var i=0;i<picked.length;i++){ if(ETQ_THEMES[picked[i].theme]) hasE=true; }
  if(!hasE){
    var epool=cand.filter(function(q){return ETQ_THEMES[q.theme] && picked.indexOf(q)===-1;});
    if(!epool.length) epool=pool.filter(function(q){return ETQ_THEMES[q.theme];});
    if(epool.length) picked[picked.length-1]=shuffle(epool)[0];
  }
  recentQs[flag]=picked.concat(recent).slice(0,TARGET*2);
  return shuffle(picked);
}

var bonusQ=null, lastBonus=null;
function pickBonus(){
  if(!BONUS.length) return null;
  if(BONUS.length===1) return BONUS[0];
  var b; do { b=shuffle(BONUS)[0]; } while(b===lastBonus);
  lastBonus=b; return b;
}

   SON (WebAudio, sans fichier externe)
   ============================================================ */
var actx=null;
function ensureAudio(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; } } return actx; }
function beep(freq,dur,type,vol,delay){
  if(profile && profile.muted) return;
  var ac=ensureAudio(); if(!ac) return;
  var t0=ac.currentTime+(delay||0);
  var osc=ac.createOscillator(), g=ac.createGain();
  osc.type=type||'sine'; osc.frequency.setValueAtTime(freq,t0);
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(vol||0.12,t0+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  osc.connect(g); g.connect(ac.destination);
  osc.start(t0); osc.stop(t0+dur+0.02);
}

    var s=localStorage.getItem(SAVE_KEY);
    if(s) return JSON.parse(s);
    for(var i=0;i<LEGACY_SAVE_KEYS.length;i++){
      var old=localStorage.getItem(LEGACY_SAVE_KEYS[i]);
      if(old){ var o=JSON.parse(old); var p=blankProfile();
        p.name=o.name||''; p.avatar=o.avatar||'a1';
        if(o.stars) p.stars=o.stars; if(o.best) p.best=o.best; p.played=o.played||0;
        if(typeof o.muted==='boolean') p.muted=o.muted;
        return p;
      }
    }
    return null;
  }catch(e){return null;}
}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(profile));}catch(e){}}
function totalStars(){var t=0;for(var i=0;i<FLAG_ORDER.length;i++)t+=(profile.stars[FLAG_ORDER[i]]||0);return t;}
function rankName(){var t=totalStars(); if(t>=15)return'Legende de Coach Tiger'; if(t>=12)return'Champion du club'; if(t>=8)return'Pro en herbe'; if(t>=4)return'Espoir du parcours'; return'Bourgeon du practice';}

function avatarSVG(id,size,tier){
  size=size||64; var inner;
  if(id==='a1') inner=golfer1(tier||tierFor());
  else if(id==='a2') inner=golfer2(tier||tierFor());
  else if(id==='a3') inner=golfer3(tier||tierFor());
  else if(id==='a4') inner=golfer4(tier||tierFor());
  else if(id==='a10') inner=golfer5(tier||tierFor());
  else if(id==='a11') inner=golfer6(tier||tierFor());
  else if(id==='a5') inner=catFace();
  else if(id==='a6') inner=ballFace()+cap('#8b5cf6')+'<g fill="#ffd54d"><polygon points="'+starPts(15,18,5)+'"/><polygon points="'+starPts(49,20,5)+'"/></g>';
  else if(id==='a7') inner=robotFace();
  else if(id==='a8') inner=ballFace()+crown();

}

    '<div class="hintzone" id="hintzone"></div>'+

    document.getElementById('hintzone').classList.add('show');

function finishAnswer(good,qd){
  results.push({ok:good,theme:qd.theme});
  var exp=document.getElementById('explain'); exp.className='explain show '+(good?'good':'bad');
  var vtxt;
  if(good){streak++;if(streak>maxStreak)maxStreak=streak;celebrate();sndGood();vtxt=pick(GOOD);if(streak>=2)vtxt+=' <span class="pb-streak">&#128293; x'+streak+'</span>';}
  else{streak=0;doShake();sndBad();vtxt=pick(BAD);}
  exp.querySelector('.ebadge').outerHTML='<div class="ebadge">'+tigerCoach(good?'happy':'sad',52)+'</div>';
  document.getElementById('verdict').innerHTML=vtxt;
  document.getElementById('exptxt').textContent=qd.explain;
  document.getElementById('nextrow').classList.add('show');
  var nb=document.getElementById('nextbtn');
  var last=(current+1>=ROUND);
  nb.textContent=last?(bonusQ?'Question bonus (culture golf)':'Mon resultat'):'Question suivante';
  nb.onclick=function(){ sndClick(); if(!last){current++;renderQuestion();} else if(bonusQ){renderBonus();} else {resultScreen();} };
}
function onAnswer(){
  if(answered)return; answered=true;
  var qd=order[current];
  var chosen=parseInt(this.getAttribute('data-oi'),10);
  var good=(chosen===qd.correct);
  if(good)score++;
  var btns=view.querySelectorAll('.choice');
  for(var i=0;i<btns.length;i++){var oi=parseInt(btns[i].getAttribute('data-oi'),10);btns[i].setAttribute('disabled','disabled');if(oi===qd.correct)btns[i].className='choice correct';else if(btns[i]===this)btns[i].className='choice wrong';}
  if(good) floatPlusOne(this);
  finishAnswer(good,qd);
}
function onScenePlace(e){
  if(answered)return; answered=true;
  var qd=order[current];
  var zone=document.getElementById('tapzone');
  zone.classList.add('answered');
  var svgEl=zone.querySelector('svg');
  var rect=svgEl.getBoundingClientRect();
  var scale=rect.width/400;
  var px=e.clientX-rect.left, py=e.clientY-rect.top;
  var t=qd.target;
  var dist=Math.hypot(px/scale-t.x, py/scale-t.y);
  var good=dist<=t.r;
  if(good)score++;
  var mark=document.createElement('div');
  mark.className='tapmark '+(good?'good':'bad');
  mark.style.left=px+'px'; mark.style.top=py+'px';
  zone.appendChild(mark);
  if(!good){
    var d=t.r*2*scale;
    var tgt=document.createElement('div');
    tgt.className='taptarget';
    tgt.style.width=d+'px'; tgt.style.height=d+'px';
    tgt.style.left=(t.x*scale-d/2)+'px'; tgt.style.top=(t.y*scale-d/2)+'px';
    zone.appendChild(tgt);
  }
  if(good) floatPlusOne(mark);
  finishAnswer(good,qd);
}

/* ============================================================
   RESULTAT + ETOILES + SAUVEGARDE
   ============================================================ */
function starsFromScore(s,total){ if(s>=total)return 3; if(s>=total-1)return 2; if(s>=Math.ceil(total*0.6))return 1; return 0; }
function animateCount(el,to,dur){
  if(reduceMotion){ el.textContent=to; return; }
  var t0=performance.now();
  function step(t){
    var p=Math.min(1,(t-t0)/dur);
    el.textContent=Math.round(p*to);
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
function resultScreen(){
  progTxt.textContent='Partie terminee'; progBar.style.width='100%';
  var earned=starsFromScore(score,ROUND);
  var unlockMsg=''; var evoHtml='';
  if(curFlag!=='all'){
    var before=totalStars();
    profile.played=(profile.played||0)+1;
    if(score>(profile.best[curFlag]||0)) profile.best[curFlag]=score;
    if(earned>(profile.stars[curFlag]||0)) profile.stars[curFlag]=earned;
    var after=totalStars();
    var tierBefore=tierFor(before), tierAfter=tierFor(after);
    if(tierAfter>tierBefore && ['a1','a2','a3','a4','a10','a11'].indexOf(profile.avatar)!==-1){
      evoHtml='<div class="evorow"><div class="evolabel">Ton golfeur evolue !</div>'+
        '<div class="evorow-imgs">'+avatarSVG(profile.avatar,64,tierBefore)+
        '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#d9c34a" stroke-width="3"><path d="M4 12h14M12 6l6 6-6 6"/></svg>'+
        avatarSVG(profile.avatar,72,tierAfter)+'</div></div>';
      celebrate(); sndStar();
    }
    for(var i=0;i<MASCOTS.length;i++){ if(MASCOTS[i].need>before && MASCOTS[i].need<=after){ unlockMsg='Nouvel avatar debloque : '+MASCOTS[i].name+' !'; } }
    var idxFlag=FLAG_ORDER.indexOf(curFlag);
    if(earned>=1 && idxFlag>=0 && idxFlag<FLAG_ORDER.length-1){
      var nextF=FLAG_ORDER[idxFlag+1];
      if((before<1 || (profile.stars[curFlag]===earned && earned===1)) && stageUnlocked(nextF) && !unlockMsg){
        /* etape suivante deverrouillee (informatif, pas bloquant si deja debloquee) */
      }
    }
    persist();
  }
  var starsHtml='';
  for(var s=0;s<3;s++)starsHtml+=starSVG(s<earned,34,s<earned);
  var msg,sub,mood;
  if(score===ROUND){msg='Sans-faute total !';sub='Parfait du debut a la fin. Tiger applaudit tres fort !';mood='happy';celebrate(true);sndStar();}
  else if(earned===2){msg='Superbe partie !';sub='Il ne manque presque rien pour le sans-faute.';mood='happy';celebrate();sndStar();}
  else if(earned===1){msg='Bien joue !';sub='Continue a t\'entrainer pour decrocher les 3 etoiles.';mood='happy';}
  else {msg='On continue de s\'entrainer.';sub='Personne ne reussit du premier coup. Tiger croit en toi, on retente !';mood='sad';}
  var rows='';
  for(var r=0;r<results.length;r++){rows+='<div class="row"><div class="n">'+(r+1)+'</div><div class="t">'+results[r].theme+'</div><div class="m '+(results[r].ok?'y':'x')+'">'+(results[r].ok?'&#10003;':'&#10007;')+'</div></div>';}
  var lvl=(curFlag==='all')?'Grand melange':FLAGS[curFlag].name;
  var bestLine=(maxStreak>=2)?'<div style="text-align:center"><span class="bestrow">&#128293; Meilleure serie : '+maxStreak+' d\'affilee</span></div>':'';
  var unlockLine=unlockMsg?'<div class="unlock">'+starSVG(true,18)+unlockMsg+'</div>':'';
  var starBlock=(curFlag!=='all')?'<div class="starsbig">'+starsHtml+'</div>':'';
  setView(
    '<div class="pad result"><h2>'+msg+'</h2>'+
    '<div class="tiger-wrap center">'+tigerCoach(mood,84)+'</div>'+
    starBlock+
    '<div class="scorebig"><span id="scnum">0</span><small>/'+ROUND+'</small></div>'+
    '<div class="verdict">'+lvl+' &middot; '+sub+'</div>'+
    evoHtml+unlockLine+bestLine+
    '<div class="scorecard">'+rows+'</div>'+
    '<button class="btn big" id="again">Rejouer cette etape</button>'+
    '<button class="btn ghost big" id="home" style="margin-top:10px">Retour a l\'academie</button>'+
    '<div class="footer">Un jeu imagine avec Coach Tiger, pour progresser sur les regles et l\'etiquette du golf.<br>Inspire du programme des Drapeaux ffgolf / PGA France et des Regles du Golf. Outil de revision.</div></div>'
  );
  animateCount(document.getElementById('scnum'),score,700);
  document.getElementById('again').onclick=function(){sndClick();startRound(curFlag);};
  document.getElementById('home').onclick=function(){sndClick();screenHome();};
}

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  var s=loadSave();
  if(s && s.name){ profile=s;
    if(!profile.stars)profile.stars={vert:0,rouge:0,bleu:0,jaune:0,blanc:0};
    if(!profile.best)profile.best={vert:0,rouge:0,bleu:0,jaune:0,blanc:0};
    if(typeof profile.muted!=='boolean')profile.muted=false;
    updateMuteBtn();
    screenHome();
  } else { profile=blankProfile(); updateMuteBtn(); screenProfile(); }
}
boot();

</script>
