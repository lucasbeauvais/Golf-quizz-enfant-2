<div class="wrap">

        <path d="M4 3 L22 8 L4 13 Z" fill="#e8c94a"/>
        <ellipse cx="4" cy="32" rx="4" ry="2" fill="#ffffff" opacity=".35"/>
      </svg>
      <div class="brand"><span class="brandtitle">Golf Academy</span><small>L'aventure des drapeaux</small></div>
      <div class="progress" id="prog" style="display:none">
        <span id="progtxt">Question 1 / 5</span>
        <div class="track"><i id="progbar"></i></div>
      </div>
      <button class="mutebtn" id="quitbtn" title="Retour au menu" aria-label="Quitter le questionnaire et retourner au menu" style="display:none">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>

    </div>
    <div class="body" id="view"></div>
  </div>
</div>
